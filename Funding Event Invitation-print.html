<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civitta — Funding Event Kyiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'Power Grotesk';
    src: url('fonts/PowerGrotesk-Regular.otf') format('opentype');
    font-weight: 400 700;
    font-style: normal;
    font-display: swap;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #1d1d1d;
    font-family: 'Inter', sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  #root { width: 100%; }

  @media print {
    @page {
      size: A4 portrait;
      margin: 0;
    }
    html, body {
      width: 210mm;
      height: 297mm;
      overflow: hidden;
    }
    #root {
      width: 210mm;
      height: 297mm;
    }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

const accentColor = "#ebff40";
const bgColor = "#1d1d1d";

function Tag({ children }) {
  return (
    <span style={{
      display: 'inline-block',
      border: `1.5px solid ${accentColor}`,
      color: accentColor,
      fontFamily: "'Inter', sans-serif",
      fontSize: 10,
      fontWeight: 600,
      letterSpacing: '0.12em',
      textTransform: 'uppercase',
      padding: '3px 10px',
      borderRadius: 2
    }}>{children}</span>
  );
}

function Invitation() {
  return (
    <div style={{
      position: 'relative',
      background: bgColor,
      width: '100%',
      minHeight: '100vh',
      overflow: 'hidden',
      display: 'flex',
      alignItems: 'stretch',
      WebkitPrintColorAdjust: 'exact',
      printColorAdjust: 'exact'
    }}>

      {/* Background lines image */}
      <img
        src="uploads/Civitta graphic elements PNG-01.png"
        aria-hidden="true"
        style={{
          position: 'absolute',
          top: 0,
          right: 0,
          height: '100%',
          width: 'auto',
          pointerEvents: 'none',
          opacity: 0.99,
          filter: 'invert(1)',
          mixBlendMode: 'screen',
          userSelect: 'none',
          WebkitPrintColorAdjust: 'exact',
          printColorAdjust: 'exact'
        }}
      />

      {/* Gradient overlay */}
      <div style={{
        position: 'absolute', inset: 0, zIndex: 1,
        background: `linear-gradient(105deg, ${bgColor} 50%, transparent 100%)`,
        pointerEvents: 'none',
        WebkitPrintColorAdjust: 'exact',
        printColorAdjust: 'exact'
      }} />

      {/* Content */}
      <div style={{
        position: 'relative',
        zIndex: 2,
        maxWidth: 860,
        width: '100%',
        margin: '0 auto',
        padding: '48px 56px 48px 56px',
        display: 'flex',
        flexDirection: 'column',
        gap: 0,
      }}>

        {/* Top: Logo + tag */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 20, marginBottom: 48 }}>
          <img
            src="uploads/pasted-1777972902090-0.png"
            alt="Civitta Defence"
            style={{ display: 'block', height: 44, width: 'auto' }}
          />
          <div style={{ width: 1, height: 18, background: 'rgba(255,255,255,0.2)' }} />
          <Tag>MilTech Funding · Kyiv 2026</Tag>
        </div>

        {/* Pre-headline */}
        <p style={{
          fontFamily: "'Inter', sans-serif",
          fontSize: 12,
          fontWeight: 500,
          color: 'rgba(255,255,255,0.5)',
          letterSpacing: '0.18em',
          textTransform: 'uppercase',
          marginBottom: 20
        }}>CIVITTA DEFENCE PRESENTS</p>

        {/* Headline */}
        <h1 style={{
          fontFamily: "'Power Grotesk', 'Space Grotesk', Helvetica, sans-serif",
          fontSize: 52,
          fontWeight: 400,
          color: '#fff',
          lineHeight: 1.1,
          letterSpacing: '-0.01em',
          marginBottom: 32,
          maxWidth: 600,
          textWrap: 'pretty'
        }}>
          Ukrainian Miltech: it's time to{' '}
          <em style={{ color: accentColor, fontStyle: 'normal', fontWeight: 700 }}>access the funding</em>{' '}
          that powers your mission.
        </h1>

        {/* Divider */}
        <div style={{ width: 40, height: 2, background: accentColor, marginBottom: 28 }} />

        {/* Body copy */}
        <p style={{
          color: 'rgba(255,255,255,0.72)',
          fontSize: 15,
          lineHeight: 1.65,
          maxWidth: 500,
          marginBottom: 36,
          fontWeight: 400,
          textWrap: 'pretty'
        }}>
          Join us for a focused half-day to learn about{' '}
          <span style={{ color: '#fff', fontWeight: 600 }}>EDIP</span>,
          Ukrainian funding instruments, and the{' '}
          <span style={{ color: '#fff', fontWeight: 600 }}>Bridge to Ukraine</span> programme –
          plus secure 1:1 meetings with Civitta's funding experts.
        </p>

        {/* Track record box */}
        <div style={{
          border: `1px solid ${accentColor}`,
          borderLeft: `3px solid ${accentColor}`,
          background: 'rgba(235, 255, 64, 0.04)',
          padding: '20px 24px',
          maxWidth: 520,
          marginBottom: 36,
          borderRadius: 2
        }}>
          <p style={{
            fontFamily: "'Inter', sans-serif",
            fontSize: 10,
            fontWeight: 600,
            letterSpacing: '0.14em',
            textTransform: 'uppercase',
            color: accentColor,
            marginBottom: 12
          }}>Civitta's track record in defence funding</p>

          <div style={{ display: 'flex', gap: 32, flexWrap: 'wrap', marginBottom: 12 }}>
            <div>
              <p style={{
                fontFamily: "'Power Grotesk', 'Inter', sans-serif",
                fontSize: 30,
                fontWeight: 700,
                color: '#fff',
                lineHeight: 1,
                marginBottom: 3
              }}>€2.4M</p>
              <p style={{ fontSize: 11, color: 'rgba(255,255,255,0.55)', fontWeight: 500 }}>EDF grant secured (MICROPOL)</p>
            </div>
            <div>
              <p style={{
                fontFamily: "'Power Grotesk', 'Inter', sans-serif",
                fontSize: 30,
                fontWeight: 700,
                color: '#fff',
                lineHeight: 1,
                marginBottom: 3
              }}>€3.3M</p>
              <p style={{ fontSize: 11, color: 'rgba(255,255,255,0.55)', fontWeight: 500 }}>Total project budget mobilised</p>
            </div>
          </div>

          <p style={{ fontSize: 12, lineHeight: 1.55, color: 'rgba(255,255,255,0.65)', fontWeight: 400 }}>
            As an active <span style={{ color: '#fff', fontWeight: 600 }}>European Defence Fund</span> winner and consortium partner,
            Civitta has helped Ukrainian and European defence-tech companies unlock non-dilutive capital
            and connect with NATO-aligned procurement pathways.
          </p>
        </div>

        {/* Speakers */}
        <div style={{ marginBottom: 36, maxWidth: 580 }}>
          <p style={{
            fontFamily: "'Inter', sans-serif",
            fontSize: 10,
            fontWeight: 600,
            letterSpacing: '0.14em',
            textTransform: 'uppercase',
            color: accentColor,
            marginBottom: 16
          }}>Featured speakers</p>

          <div style={{ display: 'flex', gap: 24 }}>
            {[
              { img: 'speakers/speaker3.png', name: 'Iurii-Volodymyr Blavt', role: 'Partner', org: '', bio: 'EU funding attraction expert for innovative companies' },
              { img: 'speakers/speaker1.png', name: 'Kyrylo Kryvolap', role: 'Managing Partner', org: '', bio: '20+ years leading 50+ major policy & corporate projects, including in defense' },
              { img: 'speakers/speaker2.png', name: 'Greg Fishman', role: 'Senior Advisor', org: '', bio: 'Private sector defense & reconstruction lead, partnering with primes from Europe & the US' }
            ].map((s) => (
              <div key={s.name} style={{ display: 'flex', flexDirection: 'column', gap: 8, flex: 1 }}>
                <img src={s.img} alt={s.name} style={{
                  width: 56, height: 56, borderRadius: '50%',
                  objectFit: 'cover',
                  border: `2px solid ${accentColor}`
                }} />
                <div>
                  <p style={{ fontFamily: "'Inter', sans-serif", color: '#fff', fontWeight: 600, fontSize: 12, lineHeight: 1.25, marginBottom: 2 }}>{s.name}</p>
                  <p style={{ fontFamily: "'Inter', sans-serif", color: accentColor, fontWeight: 500, fontSize: 10.5, lineHeight: 1.3, marginBottom: 5 }}>{s.role}{s.org ? ` · ${s.org}` : ''}</p>
                  <p style={{ fontFamily: "'Inter', sans-serif", color: 'rgba(255,255,255,0.55)', fontWeight: 400, fontSize: 11, lineHeight: 1.4 }}>{s.bio}</p>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Event details */}
        <div style={{ display: 'flex', gap: 48, marginBottom: 40 }}>
          {[
            { label: 'Date', value: 'May 18, 2026' },
            { label: 'Time', value: '10:00 – 13:00' },
            { label: 'Location', value: 'Osvitoria Hub\nKniaziv Ostrozkykh St, 2, Kyiv, 01010' }
          ].map(({ label, value }) => (
            <div key={label}>
              <p style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: accentColor, marginBottom: 5 }}>{label}</p>
              <p style={{ fontSize: 14, color: '#fff', fontWeight: 500, lineHeight: 1.3, whiteSpace: 'pre-line' }}>{value}</p>
            </div>
          ))}
        </div>

        {/* CTA */}
        <div style={{
          display: 'inline-block',
          background: accentColor,
          color: bgColor,
          fontFamily: "'Inter', sans-serif",
          fontWeight: 700,
          fontSize: 13,
          letterSpacing: '0.06em',
          textTransform: 'uppercase',
          padding: '13px 32px',
          borderRadius: 2,
          alignSelf: 'flex-start',
          marginBottom: 36
        }}>
          Register Now →
        </div>

        {/* Footer */}
        <div style={{
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          paddingTop: 24,
          borderTop: '1px solid rgba(255,255,255,0.1)'
        }}>
          <p style={{ fontSize: 12, color: 'rgba(255,255,255,0.35)', fontWeight: 400 }}>
            Contact: <span style={{ color: 'rgba(255,255,255,0.6)' }}>maria.andrukhiv@civitta.com</span>
          </p>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Invitation />);

// Auto-print after fonts + Babel settle
setTimeout(() => {
  document.fonts.ready.then(() => {
    setTimeout(() => window.print(), 500);
  });
}, 500);

</script>
</body>
</html>
